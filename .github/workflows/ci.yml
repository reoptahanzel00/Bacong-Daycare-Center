name: CI — Build & Lint Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-lint:
    name: Build, TypeCheck & Lint
    runs-on: ubuntu-latest

    # No service-role key at job level. Job-level env reaches every step,
    # including `npm ci`, where any dependency's install script could read it.
    # Nothing here needs it: the build and the demo E2E run without Supabase,
    # and the authenticated E2E step receives its own staging secrets below.
    # Only the staging URL is kept here, because the step condition reads it.
    env:
      E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Node 20 reached end of life on 2026-10-01.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Production dependencies only: a critical or high advisory in what
      # ships (the Next.js RCE fixed on 2026-10-05 was one) fails the build.
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: ESLint check
        run: npm run lint

      - name: Schema/route contract check
        run: npm run check:contract

      # Every table in the public schema must have RLS on and a policy. Supabase
      # grants anon full DML by default and RLS is the only thing that takes it
      # back, so a table shipped without it is world-writable through the anon
      # key that lives in the browser bundle. Two tables shipped that way and
      # nothing caught it -- the app worked, because the application layer never
      # tried what was permitted.
      - name: Row Level Security contract check
        run: npm run check:rls

      - name: Build production bundle
        run: npm run build

      # The E2E suite runs the app in offline demo mode (playwright.config.ts
      # blanks the Supabase env), so it needs no secrets and no live database.
      # Without this step the regression cover -- the enrollment verification
      # bypass and the sign-in rate limiter among them -- only ever ran on a
      # developer's machine.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (offline demo mode)
        run: npm run test:e2e

      # Authenticated coverage runs only when a staging project is configured.
      # These are the tests that prove the RLS policies hold -- one parent
      # cannot see another parent's child -- which the demo suite cannot reach.
      # Secretless runs (forks, first-time clones) skip this and stay green.
      - name: End-to-end tests (authenticated, staging)
        if: ${{ env.E2E_SUPABASE_URL != '' }}
        env:
          E2E_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL }}
          E2E_SUPABASE_ANON_KEY: ${{ secrets.E2E_SUPABASE_ANON_KEY }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_SUPABASE_SERVICE_ROLE_KEY }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7
